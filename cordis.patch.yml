# Register the token usage plugin without changing the profile's default model.
# It only reads the host's own session logs; it starts no OAuth flow, copies no
# credential off-box and registers no model provider.
#
# The `id` is the host's internal entry key. It must be unique across every
# installed plugin: npm also hosts an unrelated unscoped package literally
# named `dsh-token-usage` (a different implementation), and the host's loader
# reuses a given id without complaining. Using the scoped package name keeps
# the two installs from silently colliding. This plugin keeps no state under
# the entry key, so the rename costs nothing.
- insert:
    - id: '@sole373/dsh-token-usage'
      name: '@sole373/dsh-token-usage'
